apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-web
  namespace: k8s-study
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-web
  template:
    metadata:
      labels:
        app: storage-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.29.8-alpine
          volumeMounts:
            - name: web-data
              mountPath: /usr/share/nginx/html
      volumes:
        - name: web-data
          persistentVolumeClaim:
            claimName: storage-demo
